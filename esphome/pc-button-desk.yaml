# remote-pc-power-button v2.0.1: pc-button-desk. See the README for the secrets and the MACs to fill in.

# Desk unit: the physical power button and status LED, on WiFi and in Home
# Assistant. Talks to pc-button-relay inside the PC over ESP-NOW.
# Board: Arduino Nano ESP32.

substitutions:
  name: pc-button-desk
  project: remote-pc-power-button
  pc_button_relay_mac: "02:00:00:00:00:22"  # MAC of that unit, from its boot log (see the README)

esphome:
  project:
    name: ${project}.${name}
    version: v2.0.1
  name: ${name}
  friendly_name: PC Button Desk
  on_boot:
    - script.execute: led_state_watchdog

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

globals:
  - id: wifi_request              # relay unit WiFi asked for: 0 none, 1 on, 2 off
    type: int
    restore_value: false
    initial_value: '0'

  - id: wifi_request_sends        # repeats of the current request
    type: int
    restore_value: false
    initial_value: '0'

logger:
  logs:
    script: INFO                    # the two watchdogs re-arm every second

api:
  encryption:
    key: !secret pc_button_desk_api_key

ota:
  - platform: esphome
    encryption:                     # inherits the api key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}-fallback
    password: !secret ap_password
  power_save_mode: none

# ── ESP-NOW link to the relay unit ─────────────────────────────
# → down / held / up / wifi_on / wifi_off
# ← on / off                             (PC power)
# ← sat_wifi_enabled / sat_wifi_disabled (relay unit WiFi component state)
espnow:
  peers:
    - ${pc_button_relay_mac}
  on_receive:
    - lambda: 'id(sat_link).publish_state(true);'   # any frame proves the link
    - script.execute: link_watchdog
    - if:
        condition:
          lambda: 'return size == 2 && memcmp(data, "on", 2) == 0;'
        then:
          - light.turn_on:
              id: status_led
              brightness: 60%
          - binary_sensor.template.publish:
              id: pc_power_remote
              state: ON
          - script.execute: led_state_watchdog
    - if:
        condition:
          lambda: 'return size == 3 && memcmp(data, "off", 3) == 0;'
        then:
          - script.stop: led_state_watchdog
          - light.turn_off: status_led
          - binary_sensor.template.publish:
              id: pc_power_remote
              state: OFF
    - if:
        condition:
          lambda: 'return size == 16 && memcmp(data, "sat_wifi_enabled", 16) == 0;'
        then:
          - lambda: |-
              id(sat_wifi_sw).publish_state(true);
              if (id(wifi_request) == 1) id(wifi_request) = 0;   // confirmed
    - if:
        condition:
          lambda: 'return size == 17 && memcmp(data, "sat_wifi_disabled", 17) == 0;'
        then:
          - lambda: |-
              id(sat_wifi_sw).publish_state(false);
              if (id(wifi_request) == 2) id(wifi_request) = 0;   // confirmed

script:
  - id: send_wifi_request         # one wifi_on or wifi_off frame, as requested
    then:
      - espnow.send:
          address: ${pc_button_relay_mac}
          data: !lambda |-
            std::string s = id(wifi_request) == 1 ? "wifi_on" : "wifi_off";
            return std::vector<uint8_t>(s.begin(), s.end());

  - id: held_repeater
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - espnow.send:
                address: ${pc_button_relay_mac}
                data: held
            - delay: 50ms

  - id: led_state_watchdog          # silence from relay unit → assume PC off
    mode: restart
    then:
      - delay: 4s
      - light.turn_off: status_led
      - binary_sensor.template.publish:
          id: pc_power_remote
          state: OFF

  - id: link_watchdog               # no frames in 90s → link down
    mode: restart
    then:
      - delay: 90s
      - logger.log: "no frames from satellite for 90s"
      - lambda: 'id(sat_link).publish_state(false);'

binary_sensor:
  - platform: gpio                  # physical Kolink button
    pin:
      number: GPIO5                 # D2
      mode: INPUT_PULLUP
      inverted: true
    id: pwr_button
    internal: true
    on_press:
      - logger.log: "BTN: down"
      - espnow.send:
          address: ${pc_button_relay_mac}
          data: down
      - script.execute: held_repeater
    on_release:
      - logger.log: "BTN: up"
      - script.stop: held_repeater
      - espnow.send:
          address: ${pc_button_relay_mac}
          data: up

  - platform: template              # HA's view of PC power (radio-relayed)
    name: "PC Power"
    id: pc_power_remote
    device_class: power

  - platform: template              # is the relay unit talking to us at all
    name: "Satellite Link"
    id: sat_link
    device_class: connectivity

switch:
  - platform: template              # HA control for the relay unit's WiFi
    name: "Satellite WiFi"
    id: sat_wifi_sw
    optimistic: false               # state comes from the relay unit's report
    turn_on_action:
      - logger.log: "CMD: wifi_on, repeated until the relay unit reports it"
      - lambda: 'id(wifi_request) = 1; id(wifi_request_sends) = 0;'
      - script.execute: send_wifi_request
    turn_off_action:
      - logger.log: "CMD: wifi_off, repeated until the relay unit reports it"
      - lambda: 'id(wifi_request) = 2; id(wifi_request_sends) = 0;'
      - script.execute: send_wifi_request

interval:
  - interval: 1s                  # repeat a WiFi request until the relay unit reports it
    then:
      - if:
          condition:
            lambda: |-
              if (id(wifi_request) == 0) return false;
              if (++id(wifi_request_sends) <= 300) return true;   // 5 min
              ESP_LOGW("sat", "relay unit did not report the requested wifi state in 5 min, giving up");
              id(wifi_request) = 0;
              return false;
          then:
            - script.execute: send_wifi_request

output:
  - platform: ledc
    pin: GPIO6                      # D3 — blue LED
    id: led_out

light:
  - platform: monochromatic
    name: "PC Power LED"
    output: led_out
    internal: true
    id: status_led

captive_portal:

safe_mode:
